[package]
name = "subsonic-nexus"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
diesel = { version = "2.3.9", features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel-async = { version = "0.9.0", features = ["sqlite", "bb8"] }
diesel_migrations = "2.3.2"
md5 = "0.8.0"
opensubsonic = "0.3.0"
reqwest = { version = "0.13.3", features = ["stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_qs = "1.1.2"
serde_urlencoded = "0.7.1"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
