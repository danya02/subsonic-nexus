apiVersion: apps/v1
kind: Deployment
metadata:
  name: subsonic-nexus
  namespace: default
  labels:
    app: subsonic-nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subsonic-nexus
  template:
    metadata:
      labels:
        app: subsonic-nexus
    spec:
      containers:
        - name: subsonic-nexus
          image: ghcr.io/danya02/subsonic-nexus:main
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: RUST_LOG
              value: "subsonic_nexus=debug,tower_http=info"
          volumeMounts:
            # nexus.toml from Secret
            - name: config
              mountPath: /app/nexus.toml
              subPath: nexus.toml
              readOnly: true
            # nexus.db lives in the container's writable layer — ephemeral by nature
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /rest/ping?u=probe&t=probe&s=probe&v=1.16.1&c=k8s-probe&f=json
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: config
          secret:
            secretName: subsonic-nexus-config
---
apiVersion: v1
kind: Service
metadata:
  name: subsonic-nexus
  namespace: default
spec:
  selector:
    app: subsonic-nexus
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
