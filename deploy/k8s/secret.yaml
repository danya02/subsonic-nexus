# Store nexus.toml as a Secret because it contains upstream server passwords.
# Replace the values below with your real credentials, then apply:
#
#   kubectl apply -f secret.yaml
#
# Or manage with an external secrets operator (1Password, Vault, etc.) instead.
apiVersion: v1
kind: Secret
metadata:
  name: subsonic-nexus-config
  namespace: default
type: Opaque
stringData:
  nexus.toml: |
    [[server]]
    name = "primary"
    url  = "https://navidrome.example.com"
    username = "alice"
    password = "CHANGE_ME"
    priority = 0

    [server.matching]
    artist = "{music_brainz_id:-{name|lowercase|trim}}"
    album  = "{music_brainz_id:-{artist_key}:{name|lowercase|trim}}"

    [nexus]
    entity_id_template = "{upstream_id}"
    proxy = false
    write_target = "primary"
    scan_interval_secs = 1800  # 30 minutes; set to 0 to disable periodic scanning

